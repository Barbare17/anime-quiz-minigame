<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Quiz Arcade</title>
<meta name="description" content="Play anime character and opening theme quizzes with real artwork and audio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0a14;
    --panel:#14152a;
    --panel-2:#1c1e3a;
    --ink:#f2efe6;
    --muted:#9491b3;
    --magenta:#ff2e63;
    --cyan:#29e0d1;
    --gold:#ffce54;
    --line:#33355c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--void);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    z-index:1000;
    mix-blend-mode:overlay;
  }
  .grain-glow{
    position:fixed; top:-20%; left:50%; transform:translateX(-50%);
    width:1200px; height:800px;
    background:radial-gradient(ellipse at center, rgba(255,46,99,0.10), transparent 60%);
    pointer-events:none; z-index:0;
  }
  #app{position:relative; z-index:1; max-width:960px; margin:0 auto; padding:28px 20px 80px;}

  /* ---- Top bar / timecode style ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:2px solid var(--line);
    padding-bottom:14px; margin-bottom:34px;
  }
  .logo{
    font-family:'Zen Dots',cursive;
    font-size:20px; letter-spacing:0.5px;
    color:var(--ink);
    display:flex; align-items:center; gap:10px;
  }
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--magenta); box-shadow:0 0 10px var(--magenta); animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.35;}}
  .tc{
    font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--muted);
    border:1px solid var(--line); padding:5px 10px;
  }

  /* ---- Hero ---- */
  .hero{margin-bottom:46px;}
  .hero .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--cyan);
    border-left:2px solid var(--cyan); padding-left:10px; margin-bottom:16px;
  }
  .hero h1{
    font-family:'Zen Dots',cursive;
    font-size:clamp(34px,6vw,58px);
    line-height:1.08;
    margin:0 0 18px;
    max-width:11ch;
  }
  .hero p{
    color:var(--muted); font-size:16px; line-height:1.6; max-width:52ch; margin:0;
  }

  /* ---- Mode cards ---- */
  .modes{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:34px;}
  @media (max-width:680px){ .modes{grid-template-columns:1fr;} }
  .mode-card{
    background:var(--panel);
    border:2px solid var(--line);
    padding:26px 24px;
    cursor:pointer;
    position:relative;
    transition:transform .15s ease, border-color .15s ease;
    box-shadow:6px 6px 0 var(--panel-2);
  }
  .mode-card:hover{ transform:translate(-3px,-3px); box-shadow:9px 9px 0 var(--panel-2); }
  .mode-card.char{ border-color:var(--magenta); }
  .mode-card.song{ border-color:var(--cyan); }
  .mode-card .tick{ position:absolute; top:14px; right:16px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted);}
  .mode-card h2{ font-family:'Zen Dots',cursive; font-size:20px; margin:6px 0 10px; }
  .mode-card.char h2{ color:var(--magenta); }
  .mode-card.song h2{ color:var(--cyan); }
  .mode-card p{ color:var(--muted); font-size:14px; line-height:1.55; margin:0 0 16px;}
  .mode-card .count{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink); }

  /* ---- Setup panel ---- */
  .panel{ background:var(--panel); border:2px solid var(--line); padding:28px; margin-top:26px; }
  .panel h3{ font-family:'Zen Dots',cursive; font-size:16px; margin:0 0 18px; }
  .field{ margin-bottom:22px; }
  .field label{ display:block; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); margin-bottom:10px; }
  .chip-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .chip{
    border:2px solid var(--line); background:transparent; color:var(--ink);
    padding:9px 16px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px;
    cursor:pointer; transition:all .12s ease;
  }
  .chip:hover{ border-color:var(--muted); }
  .chip.active{ background:var(--ink); color:var(--void); border-color:var(--ink); }
  .chip.diff-easy.active{ background:#54c98b; border-color:#54c98b; color:#0a0a14;}
  .chip.diff-medium.active{ background:var(--gold); border-color:var(--gold); color:#0a0a14;}
  .chip.diff-hard.active{ background:var(--magenta); border-color:var(--magenta); color:#fff;}
  .chip.diff-mixed.active{ background:var(--cyan); border-color:var(--cyan); color:#0a0a14;}
  .go-btn{
    font-family:'Zen Dots',cursive; font-size:15px;
    background:var(--magenta); color:#fff; border:none;
    padding:15px 30px; cursor:pointer; margin-top:6px;
    box-shadow:5px 5px 0 var(--panel-2);
    transition:transform .12s ease;
  }
  .go-btn.song{ background:var(--cyan); color:#0a0a14; }
  .go-btn:hover{ transform:translate(-2px,-2px); }
  .go-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .back-link{
    background:none; border:none; color:var(--muted); font-family:'JetBrains Mono',monospace;
    font-size:12px; cursor:pointer; padding:0; margin-bottom:18px; display:inline-flex; align-items:center; gap:6px;
  }
  .back-link:hover{ color:var(--ink); }

  /* ---- Quiz screen ---- */
  .quiz-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; gap:14px; flex-wrap:wrap;}
  .stat{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); }
  .stat b{ color:var(--ink); font-size:14px; }
  .progress-bar{ height:4px; background:var(--panel-2); width:100%; margin-bottom:26px; overflow:hidden;}
  .progress-fill{ height:100%; background:var(--magenta); transition:width .2s linear;}
  .progress-fill.song{ background:var(--cyan); }
  .timer-ring{ font-family:'JetBrains Mono',monospace; font-size:13px; padding:5px 10px; border:1px solid var(--line);}
  .timer-ring.low{ color:var(--magenta); border-color:var(--magenta); }

  .qcard{ background:var(--panel); border:2px solid var(--line); padding:30px; text-align:center; }
  .qcard .prompt{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--cyan); margin-bottom:18px; }
  .qcard.char .prompt{ color:var(--magenta); }

  .avatar-wrap{
    width:min(100%,280px); min-height:350px; margin:0 auto 14px;
    display:flex; align-items:center; justify-content:center; position:relative;
    overflow:hidden; background:#080811; border:2px solid var(--line); padding:8px;
  }
  .avatar-wrap::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 45px rgba(10,10,20,.35);
  }
  .avatar-wrap img{
    display:block; width:auto; height:auto; max-width:100%; max-height:440px;
    object-fit:contain; image-rendering:auto;
  }
  .avatar-wrap svg{ width:210px; height:265px; }
  .media-loader{
    width:36px; height:36px; border:3px solid var(--line); border-top-color:var(--magenta);
    border-radius:50%; animation:spin .75s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .hint-chip{
    display:inline-block; font-family:'JetBrains Mono',monospace; font-size:12px;
    color:var(--gold); border:1px dashed var(--gold); padding:6px 12px; margin-top:10px; cursor:pointer;
  }
  .hint-chip.revealed{ cursor:default; }

  .play-block{ display:flex; flex-direction:column; align-items:center; gap:16px; padding:20px 0; }
  .play-btn{
    width:110px; height:110px; border-radius:50%;
    background:var(--panel-2); border:2px solid var(--cyan);
    color:var(--cyan); font-size:34px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease;
  }
  .play-btn:hover{ transform:scale(1.05); }
  .play-btn:disabled{ opacity:.45; cursor:wait; transform:none; }
  .play-btn.playing{ animation:beat 0.4s infinite alternate; }
  @keyframes beat{ from{box-shadow:0 0 0 0 rgba(41,224,209,0.5);} to{box-shadow:0 0 0 14px rgba(41,224,209,0);} }
  .waveform{ display:flex; align-items:flex-end; gap:3px; height:40px; }
  .waveform span{ width:4px; background:var(--cyan); opacity:0.5; height:8px; }
  .waveform.active span{ animation:wf 0.9s ease-in-out infinite; }
  .waveform span:nth-child(odd){ animation-delay:0.15s; }
  .waveform span:nth-child(3n){ animation-delay:0.3s; }
  @keyframes wf{ 0%,100%{height:8px;opacity:.4;} 50%{height:36px;opacity:1;} }
  .media-status{
    min-height:18px; color:var(--muted); font-family:'JetBrains Mono',monospace;
    font-size:12px; line-height:1.5;
  }
  .media-status.error{ color:var(--gold); }

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:24px; }
  @media (max-width:560px){ .options{ grid-template-columns:1fr; } }
  .opt{
    background:var(--void); border:2px solid var(--line); color:var(--ink);
    padding:16px 14px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;
    cursor:pointer; text-align:left; transition:border-color .1s ease, background .1s ease;
  }
  .opt:hover:not(:disabled){ border-color:var(--muted); }
  .opt:disabled{ cursor:default; }
  .opt.correct{ background:rgba(84,201,139,0.15); border-color:#54c98b; color:#54c98b; }
  .opt.wrong{ background:rgba(255,46,99,0.15); border-color:var(--magenta); color:var(--magenta); }
  .opt.dim{ opacity:0.35; }

  .feedback{ margin-top:18px; font-family:'JetBrains Mono',monospace; font-size:13px; min-height:20px; }
  .feedback.good{ color:#54c98b; }
  .feedback.bad{ color:var(--magenta); }

  /* ---- Results ---- */
  .result-card{ background:var(--panel); border:2px solid var(--line); padding:40px 30px; text-align:center; }
  .result-score{ font-family:'Zen Dots',cursive; font-size:52px; color:var(--gold); margin:0 0 6px;}
  .result-sub{ color:var(--muted); font-size:14px; margin-bottom:26px; }
  .result-grid{ display:flex; justify-content:center; gap:34px; margin-bottom:30px; flex-wrap:wrap;}
  .result-grid div{ font-family:'JetBrains Mono',monospace; }
  .result-grid .n{ font-size:22px; color:var(--ink); display:block; }
  .result-grid .l{ font-size:11px; color:var(--muted); }
  .result-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .ghost-btn{
    background:none; border:2px solid var(--line); color:var(--ink);
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px;
    padding:12px 22px; cursor:pointer;
  }
  .ghost-btn:hover{ border-color:var(--ink); }

  footer{ margin-top:60px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; font-family:'JetBrains Mono',monospace; line-height:1.7;}
</style>
</head>

/* =========================================================
   UTIL — deterministic hashing
   ========================================================= */
function hashStr(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); }
  return h >>> 0;
}
function rngFromSeed(seed){
  let s = seed % 2147483647; if(s<=0) s += 2147483646;
  return function(){ s = (s*16807) % 2147483647; return (s-1)/2147483646; };
}
function shuffle(arr, rnd){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor((rnd?rnd():Math.random())*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pick(arr, n, rnd){ return shuffle(arr, rnd).slice(0,n); }

const MEDIA_CACHE_PREFIX = 'anime-quiz-media-v3:';
const CHARACTER_SEARCH_ALIASES = {
  'L':'L Lawliet',
  'Mob (Shigeo Kageyama)':'Shigeo Kageyama',
  'Rock':'Rokurou Okajima',
  'Reg':'Regu',
  'Saber':'Saber',
  'Archer':'EMIYA'
};
/* High-resolution/verified overrides for characters that public catalogue
   search commonly confuses or does not contain. */
const CHARACTER_MEDIA = {
  "Ai Ohto": "https://img.anime2you.de/2020/12/wonder-egg-cd113.png",
  "Anya Forger": "https://data.onnada.com/character/202111/2036616335_284c54b7_94040f.png",
  "Loid Forger": "https://a.storyblok.com/f/178900/568x1103/de0f4f21d1/spy-x-fam_chara_loid_1.png/m/filters%3Aquality%2895%29format%28webp%29",
  "Nezumi": "https://media.kitsu.app/characters/images/33888/original.jpg",
  "Reg": "https://media.kitsu.app/characters/images/62198/original.jpg",
  "Saber": "https://media.kitsu.app/characters/images/6553/original.jpg",
  "Satoru Gojo": "https://jj-senkasouran.bn-ent.net/images/character/gojo/ill.png",
  "Simon": "https://media.kitsu.app/characters/images/19269/original.jpg"
};
let currentAudio = null;
let mediaRequestId = 0;

function normalizeMediaText(value){
  return String(value || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]/g,'');
}

function titlesMatch(a,b){
  const x = normalizeMediaText(a);
  const y = normalizeMediaText(b);
  return !!x && !!y && (x===y || (Math.min(x.length,y.length)>=5 && (x.includes(y) || y.includes(x))));
}

function cacheRead(key){
  try{
    const raw = localStorage.getItem(MEDIA_CACHE_PREFIX+key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function cacheWrite(key,value){
  try{ localStorage.setItem(MEDIA_CACHE_PREFIX+key, JSON.stringify(value)); }catch(e){}
}

async function fetchJSON(url, timeoutMs=12000){
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), timeoutMs);
  try{
    const response = await fetch(url,{signal:controller.signal});
    if(!response.ok) throw new Error('Media request failed');
    return await response.json();
  }finally{ clearTimeout(timeout); }
}

function preloadImage(url){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const timeout = setTimeout(()=>reject(new Error('Image timed out')),10000);
    img.onload = ()=>{ clearTimeout(timeout); resolve(url); };
    img.onerror = ()=>{ clearTimeout(timeout); reject(new Error('Image failed')); };
    img.src = url;
  });
}

function preloadAudio(url){
  return new Promise((resolve,reject)=>{
    const audio = new Audio();
    const cleanup = ()=>{
      clearTimeout(timeout);
      audio.removeEventListener('loadedmetadata',ready);
      audio.removeEventListener('canplay',ready);
      audio.removeEventListener('error',failed);
    };
    const ready = ()=>{ cleanup(); resolve(audio); };
    const failed = ()=>{ cleanup(); reject(new Error('Audio failed')); };
    const timeout = setTimeout(()=>{ cleanup(); reject(new Error('Audio timed out')); },12000);
    audio.preload = 'metadata';
    audio.addEventListener('loadedmetadata',ready,{once:true});
    audio.addEventListener('canplay',ready,{once:true});
    audio.addEventListener('error',failed,{once:true});
    audio.src = url;
    audio.load();
  });
}

async function loadCharacterMedia(q){
  const key = 'character:'+normalizeMediaText(q.name);
  const cached = cacheRead(key);
  if(cached && cached.url){
    try{ await preloadImage(cached.url); return cached; }catch(e){}
  }

  const verifiedUrl = CHARACTER_MEDIA[q.name];
  if(verifiedUrl){
    try{
      await preloadImage(verifiedUrl);
      const media = {url:verifiedUrl,source:'Verified character artwork'};
      cacheWrite(key,media);
      return media;
    }catch(e){}
  }

  const searchName = CHARACTER_SEARCH_ALIASES[q.name] || q.name;
  let url = null;
  let source = null;

  /* Kitsu's original file is used first. Its generated "large" thumbnail can
     contain aggressive sharpening and color artifacts. */
  try{
    const params = new URLSearchParams({'filter[name]':searchName,'page[limit]':'10'});
    const data = await fetchJSON('https://kitsu.io/api/edge/characters?'+params.toString());
    const characters = Array.isArray(data.data) ? data.data : [];
    const exact = characters.find(item=>titlesMatch(item.attributes && item.attributes.canonicalName,searchName));
    const selected = exact || characters[0];
    url = selected && selected.attributes && selected.attributes.image && selected.attributes.image.original;
    if(url) source = 'Original Kitsu character artwork';
  }catch(e){}

  if(!url){
    const params = new URLSearchParams({
      q:searchName,
      order_by:'favorites',
      sort:'desc',
      limit:'10'
    });
    const data = await fetchJSON('https://api.jikan.moe/v4/characters?'+params.toString());
    const characters = Array.isArray(data.data) ? data.data : [];
    const exact = characters.find(item=>titlesMatch(item.name,searchName));
    const selected = exact || characters[0];
    url = selected && selected.images && (
      (selected.images.webp && selected.images.webp.image_url) ||
      (selected.images.jpg && selected.images.jpg.image_url)
    );
    if(url) source = 'MyAnimeList artwork via Jikan';
  }
  if(!url) throw new Error('No character artwork found');
  await preloadImage(url);
  const media = {url,source};
  cacheWrite(key,media);
  return media;
}

function jsonp(url, timeoutMs=12000){
  return new Promise((resolve,reject)=>{
    const callback = '__animeQuizJSONP'+Date.now()+Math.floor(Math.random()*10000);
    const script = document.createElement('script');
    const cleanup = ()=>{
      clearTimeout(timeout);
      delete window[callback];
      script.remove();
    };
    window[callback] = data=>{ cleanup(); resolve(data); };
    script.onerror = ()=>{ cleanup(); reject(new Error('Preview search failed')); };
    const timeout = setTimeout(()=>{ cleanup(); reject(new Error('Preview search timed out')); },timeoutMs);
    script.src = url + (url.includes('?')?'&':'?') + 'callback=' + callback;
    document.head.appendChild(script);
  });
}

async function findApplePreview(q){
  const params = new URLSearchParams({
    term:q.name,
    media:'music',
    entity:'song',
    country:'JP',
    lang:'en_us',
    limit:'20'
  });
  const data = await jsonp('https://itunes.apple.com/search?'+params.toString());
  const tracks = (data.results || []).filter(track=>track.previewUrl);
  const selected = tracks.find(track=>titlesMatch(track.trackName,q.name)) || tracks[0];
  if(!selected) throw new Error('No music preview found');
  return {url:selected.previewUrl,source:'Apple Music preview'};
}

async function preloadAudioWithRetry(url, attempts=2){
  let lastError;
  for(let attempt=0;attempt<attempts;attempt++){
    try{ return await preloadAudio(url); }
    catch(error){
      lastError = error;
      if(attempt<attempts-1) await new Promise(resolve=>setTimeout(resolve,700));
    }
  }
  throw lastError || new Error('Audio failed');
}

async function loadOpeningMedia(q){
  const key = 'opening:'+normalizeMediaText(q.name)+'-'+normalizeMediaText(q.anime);
  const cached = cacheRead(key);
  if(cached && cached.url){
    try{
      const audio = await preloadAudioWithRetry(cached.url);
      return {...cached,audio};
    }catch(e){}
  }

  let media = null;
  const fixedUrl = OPENING_MEDIA[q.name];
  if(fixedUrl){
    try{
      const audio = await preloadAudioWithRetry(fixedUrl);
      media = {url:fixedUrl,source:'AnimeThemes',audio};
    }catch(e){}
  }
  if(!media){
    const preview = await findApplePreview(q);
    const audio = await preloadAudioWithRetry(preview.url);
    media = {...preview,audio};
  }
  cacheWrite(key,{url:media.url,source:media.source});
  return media;
}

function stopCurrentAudio(){
  if(currentAudio){
    currentAudio.pause();
    try{ currentAudio.currentTime = 0; }catch(e){}
    currentAudio.onplay = null;
    currentAudio.onpause = null;
    currentAudio.onended = null;
    currentAudio = null;
  }
  state.playing = false;
}

function setPlayingUI(playing){
  state.playing = playing;
  const btn = document.getElementById('playBtn');
  const wf = document.getElementById('waveform');
  if(btn){
    btn.classList.toggle('playing',playing);
    btn.innerHTML = playing ? '&#9632;' : '&#9658;';
    btn.setAttribute('aria-label',playing?'Pause opening':'Play opening');
  }
  if(wf) wf.classList.toggle('active',playing);
}

async function toggleOpeningPlayback(){
  if(state.answered) return;
  if(!currentAudio){
    if(state.media.status==='error') beginQuestion();
    return;
  }
  if(!currentAudio.paused){ currentAudio.pause(); return; }
  try{
    if(currentAudio.ended) currentAudio.currentTime = 0;
    await currentAudio.play();
  }catch(e){
    const status = document.getElementById('mediaStatus');
    if(status){ status.textContent='Playback was blocked — tap play once more.'; status.classList.add('error'); }
    setPlayingUI(false);
  }
}

  qCount:10,
  questions:[],
  qIndex:0,
  score:0,
  streak:0,
  correctCount:0,
  hintUsed:false,
  timer:null,
  timeLeft:0,
  timeLimit:15,
  answered:false,
  playing:false,
  media:{status:'idle',url:null,source:null,error:null}
};

function poolFor(mode, diff){
  const src = mode==='char' ? CHARACTERS : OPENINGS;
  if(diff==='mixed') return src;
  return src.filter(x=>x[2]===diff);
}

function buildQuestions(mode, diff, count){
  const pool = poolFor(mode, diff);
  const chosen = pick(pool, Math.min(count, pool.length));
  return chosen.map(item=>{
    const [name, anime, itemDiff, extra] = item;
    // distractor pool: same mode, different correct answer text
    const answerKey = mode==='char' ? name : anime;
    const fullPool = mode==='char' ? CHARACTERS : OPENINGS;
    const candidates = Array.from(new Set(
      fullPool.filter(x=> (mode==='char'?x[0]:x[1]) !== answerKey).map(x=> mode==='char'?x[0]:x[1])
    ));
    const distractors = pick(candidates, 3);
    const options = shuffle([answerKey, ...distractors]);
    return {
      name, anime, difficulty:itemDiff, extra,
      answer: answerKey,
      options
    };
  });
}

  state.score = 0;
  state.streak = 0;
  state.correctCount = 0;
  state.view = 'quiz';
  beginQuestion();
}

function timeLimitFor(){
  const q = state.questions[state.qIndex];
  const diff = q.difficulty;
  return diff==='hard' ? 12 : diff==='medium' ? 16 : 20;
}

async function beginQuestion(){
  stopCurrentAudio();
  const requestId = ++mediaRequestId;
  state.answered = false;
  state.hintUsed = false;
  state.playing = false;
  state.media = {status:'loading',url:null,source:null,error:null};
  state.timeLimit = timeLimitFor();
  state.timeLeft = state.timeLimit;
  if(state.timer) clearInterval(state.timer);
  render();

  const q = state.questions[state.qIndex];
  try{
    const media = state.mode==='char' ? await loadCharacterMedia(q) : await loadOpeningMedia(q);
    if(requestId!==mediaRequestId || state.view!=='quiz') return;
    state.media = {status:'ready',url:media.url,source:media.source,error:null};
    if(state.mode==='char'){
      const frame = document.getElementById('avatarFrame');
      if(frame) frame.innerHTML = `<img src="${media.url}" alt="Mystery anime character">`;
    }else{
      currentAudio = media.audio;
      currentAudio.onplay = ()=>setPlayingUI(true);
      currentAudio.onpause = ()=>setPlayingUI(false);
      currentAudio.onended = ()=>setPlayingUI(false);
      const btn = document.getElementById('playBtn');
      if(btn) btn.disabled = false;
    }
    const status = document.getElementById('mediaStatus');
    if(status){
      status.textContent = state.mode==='char' ? 'Character image loaded' : 'Opening loaded — tap play';
      status.classList.remove('error');
    }
  }catch(e){
    if(requestId!==mediaRequestId || state.view!=='quiz') return;
    state.media = {status:'error',url:null,source:null,error:e.message};
    const status = document.getElementById('mediaStatus');
    if(status){
      status.textContent = state.mode==='char'
        ? 'Artwork could not be loaded — showing the backup card.'
        : 'Opening could not load — tap the retry button.';
      status.classList.add('error');
    }
    if(state.mode==='char'){
      const frame = document.getElementById('avatarFrame');
      if(frame) frame.innerHTML = avatarSVG(q.name);
    }else{
      const btn = document.getElementById('playBtn');
      if(btn){
        btn.disabled = false;
        btn.innerHTML = '&#8635;';
        btn.setAttribute('aria-label','Retry opening');
      }
      return;
    }
  }

  document.querySelectorAll('#optionsRow .opt').forEach(btn=>btn.disabled=false);
  startQuestionTimer();
}

function startQuestionTimer(){
  if(state.timer) clearInterval(state.timer);
  state.timer = setInterval(()=>{
    state.timeLeft -= 0.1;
    if(state.timeLeft<=0){
      state.timeLeft = 0;
      clearInterval(state.timer);
      lockAnswer(null);
    }
    updateTimerUI();
  }, 100);
}

function updateTimerUI(){
  const fill = document.getElementById('qProgressFill');
  const ring = document.getElementById('timerRing');
  if(!fill||!ring) return;
  if(state.media.status==='loading'){
    fill.style.width = '100%';
    ring.textContent = 'LOADING';
    ring.classList.remove('low');
    return;
  }
  const pct = Math.max(0, (state.timeLeft/state.timeLimit))*100;
  fill.style.width = pct+'%';
  ring.textContent = state.timeLeft.toFixed(1)+'s';
  ring.classList.toggle('low', state.timeLeft < state.timeLimit*0.25);
}

function renderQuiz(){
  const q = state.questions[state.qIndex];
  const isChar = state.mode==='char';
  app.innerHTML = `
    <div class="topbar">
      <div class="logo"><span class="dot"></span> ANIME QUIZ ARCADE</div>
      <div class="tc">Q ${state.qIndex+1} / ${state.questions.length}</div>
    </div>
    <div class="quiz-head">
      <div class="stat">SCORE <b>${state.score}</b></div>
      <div class="stat">STREAK <b>${state.streak}</b></div>
      <div class="timer-ring" id="timerRing">${state.timeLeft.toFixed(1)}s</div>
    </div>
    <div class="progress-bar"><div class="progress-fill ${isChar?'':'song'}" id="qProgressFill" style="width:100%"></div></div>

    <div class="qcard ${isChar?'char':''}">
      <div class="prompt">${isChar ? 'WHO IS THIS CHARACTER?' : 'WHICH ANIME IS THIS OPENING FROM?'}</div>
      ${isChar ? renderCharBlock(q) : renderSongBlock(q)}
      <div class="options" id="optionsRow">
        ${q.options.map(opt=>`<button class="opt" data-opt="${encodeURIComponent(opt)}" ${state.media.status==='loading'?'disabled':''}>${opt}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;
  updateTimerUI();

  if(isChar){
    const hintEl = document.getElementById('hintChip');
    if(hintEl){
      hintEl.addEventListener('click', ()=>{
        if(state.hintUsed || state.answered) return;
        state.hintUsed = true;
        hintEl.textContent = q.extra;
        hintEl.classList.add('revealed');
      });
    }
  } else {
    document.getElementById('playBtn').addEventListener('click', toggleOpeningPlayback);
  }

  document.querySelectorAll('#optionsRow .opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.answered) return;
      lockAnswer(decodeURIComponent(btn.dataset.opt));
    });
  });
}

function renderCharBlock(q){
  return `
    <div class="avatar-wrap" id="avatarFrame" aria-label="Mystery character image">
      <span class="media-loader" aria-hidden="true"></span>
    </div>
    <div class="media-status" id="mediaStatus">Loading character image…</div>
    <div><span class="hint-chip" id="hintChip">Reveal hint (-30 pts)</span></div>
  `;
}
function renderSongBlock(q){
  const bars = Array.from({length:20}).map(()=> `<span style="height:${8+Math.floor(Math.random()*10)}px"></span>`).join('');
  return `
    <div class="play-block">
      <button class="play-btn" id="playBtn" aria-label="Play opening" disabled>&#9658;</button>
      <div class="waveform" id="waveform">${bars}</div>
      <div class="media-status" id="mediaStatus">Loading opening audio…</div>
    </div>
  `;
}

function lockAnswer(chosen){
  if(state.answered) return;
  state.answered = true;
  clearInterval(state.timer);
  stopCurrentAudio();
  const q = state.questions[state.qIndex];
  const correct = chosen === q.answer;
  const feedback = document.getElementById('feedback');

  document.querySelectorAll('#optionsRow .opt').forEach(btn=>{
    const val = decodeURIComponent(btn.dataset.opt);
    btn.disabled = true;
    if(val===q.answer) btn.classList.add('correct');
    else if(val===chosen) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  if(correct){
    state.streak += 1;
    const timeFrac = Math.max(0, state.timeLeft/state.timeLimit);
    let pts = Math.round(60 + 40*timeFrac) + state.streak*8;
    if(state.hintUsed) pts = Math.max(10, pts-30);
    state.score += pts;
    state.correctCount += 1;
    if(feedback){ feedback.textContent = `+${pts} — correct! (${q.answer})`; feedback.className='feedback good'; }
  } else {
    state.streak = 0;
    if(feedback){ feedback.textContent = chosen===null ? `Time's up — it was ${q.answer}` : `Not quite — it was ${q.answer}`; feedback.className='feedback bad'; }
  }

  setTimeout(()=>{
    state.qIndex += 1;
    if(state.qIndex >= state.questions.length){
      state.view='result';
      render();
    } else {
      beginQuestion();
    }
  }, 1400);
}

function renderResult(){
  const total = state.questions.length;
  const acc = Math.round((state.correctCount/total)*100);
  app.innerHTML = `
    <div class="topbar">
      <div class="logo"><span class="dot"></span> ANIME QUIZ ARCADE</div>
      <div class="tc">RESULTS</div>
    </div>
    <div class="result-card">
      <div class="result-score">${state.score}</div>
      <div class="result-sub">points · ${state.mode==='char'?'Character ID':'Opening Theme'} · ${state.difficulty}</div>
      <div class="result-grid">
        <div><span class="n">${state.correctCount}/${total}</span><span class="l">CORRECT</span></div>
        <div><span class="n">${acc}%</span><span class="l">ACCURACY</span></div>
      </div>
      <div class="result-actions">
        <button class="go-btn ${state.mode==='char'?'':'song'}" id="againBtn">Play Again</button>
        <button class="ghost-btn" id="homeBtn">Change Mode</button>
      </div>
    </div>
  `;
  document.getElementById('againBtn').addEventListener('click', startQuiz);
  document.getElementById('homeBtn').addEventListener('click', ()=>{ state.view='home'; render(); });
}

render();
</script>
</body>
</html>
